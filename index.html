<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Generator — KENG Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --blue-main: #1a6bff;
    --blue-dark: #0f4fd4;
    --blue-light: #3d87ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a1628;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    width: 100%;
    max-width: 780px;
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: #fff;
    letter-spacing: 0.04em;
    flex: 1;
  }
  .toolbar h1 span { color: #3d87ff; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
    border: none;
    transition: all 0.18s ease;
  }
  .btn-add {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.2);
  }
  .btn-add:hover { background: rgba(255,255,255,0.18); }
  .btn-export {
    background: linear-gradient(135deg, #1a6bff 0%, #00c6ff 100%);
    color: #fff;
    box-shadow: 0 4px 20px rgba(26,107,255,0.5);
  }
  .btn-export:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(26,107,255,0.65); }
  .btn-export:active { transform: translateY(0); }

  /* ── INVOICE CARD ── */
  #invoice-card {
    width: 780px;
    min-height: 1080px;
    background-color: #0f4fd4; /* Solid fallback */
    background-image: linear-gradient(145deg, #1a6bff 0%, #0f4fd4 50%, #0a3ab8 100%);
    border-radius: 24px;
    padding: 44px 48px 0 48px;
    position: relative;
    overflow: visible; 
    box-shadow: 0 24px 80px rgba(10,25,70,0.6);
  }

  /* Decorative blobs */
  #invoice-card::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    pointer-events: none;
    z-index: 1;
  }
  #invoice-card::after {
    content: '';
    position: absolute;
    bottom: 160px; left: -100px;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    pointer-events: none;
    z-index: 1;
  }

  /* ── HEADER ROW ── */
  .inv-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 36px;
    position: relative;
    z-index: 2;
  }

  .logo-block {
    display: flex; align-items: center;
  }
  .logo-block img {
    height: 56px;
    width: auto;
    object-fit: contain;
  }

  .inv-meta { text-align: right; }
  .inv-meta-row {
    display: flex; gap: 32px; justify-content: flex-end;
    margin-bottom: 4px;
  }
  .inv-meta-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
  }
  .inv-meta-value {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    outline: none;
    display: inline-block;
  }
  [contenteditable]:focus {
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    outline: 2px solid rgba(255,255,255,0.5);
    padding: 1px 4px;
  }

  /* ── TITLE SECTION ── */
  .inv-title-section {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
    z-index: 2;
    overflow: visible;
  }

  /* Cloud header decoration */
  .cloud-header {
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    opacity: 0.2;
    pointer-events: none;
    z-index: 1;
  }

  .inv-big-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 72px;
    letter-spacing: 0.12em;
    color: #fff;
    line-height: 1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.18);
    outline: none;
    display: block;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
  }
  .inv-service-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.1em;
    outline: none;
    display: block;
    margin-bottom: 14px;
    position: relative;
    z-index: 2;
  }
  .inv-subtitle {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 17px;
    color: #fff;
    letter-spacing: 0.12em;
    outline: none;
    display: block;
    position: relative;
    z-index: 2;
  }

  /* ── TABLE CONTAINER ── */
  .inv-table-container {
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    overflow: hidden;
    margin-bottom: 0;
    position: relative;
    z-index: 2;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    border-bottom: 1px solid rgba(255,255,255,0.22);
  }
  thead th {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.9);
    padding: 16px 20px;
    text-align: left;
  }
  thead th:last-child { text-align: right; padding-right: 24px; }
  thead th.col-qty { text-align: center; width: 80px; }

  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.13);
    transition: background 0.15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.05); }

  td {
    padding: 14px 20px;
    vertical-align: top;
  }
  td.col-category {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #fff;
    white-space: nowrap;
    width: 120px;
  }
  td.col-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
  }
  td.col-qty {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    text-align: center;
    width: 80px;
  }
  td.col-price {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: #fff;
    text-align: right;
    padding-right: 24px;
    white-space: nowrap;
  }

  /* Editable cell inputs */
  .cell-input {
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    color: inherit;
    letter-spacing: inherit;
    width: 100%;
    padding: 0;
  }
  .cell-input:focus {
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    padding: 2px 5px;
    margin: -2px -5px;
    outline: 2px solid rgba(255,255,255,0.45);
  }
  .cell-input::placeholder { color: rgba(255,255,255,0.35); }

  /* Tối ưu hóa chiều cao và bẻ dòng cho Description */
  textarea.cell-input {
    resize: none;
    min-height: 26px;
    line-height: 26px; /* Ép cứng chiều cao mỗi dòng */
    overflow: hidden;
    word-break: break-word; /* Tự động bẻ dòng khi text quá dài */
    white-space: pre-wrap;
  }

  /* Price và Qty không được rớt dòng */
  textarea.price-input, textarea.qty-input {
    white-space: nowrap; 
  }

  /* Delete row btn */
  .delete-row-btn {
    background: rgba(255,80,80,0.2);
    border: 1px solid rgba(255,100,100,0.3);
    color: rgba(255,150,150,0.9);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .delete-row-btn:hover {
    background: rgba(255,80,80,0.4);
    color: #fff;
  }

  /* Total row */
  .total-row td {
    padding: 18px 24px 18px 20px;
    border-top: 1.5px solid rgba(255,255,255,0.3);
  }
  .total-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    text-align: right;
    display: block;
    letter-spacing: 0.04em;
  }
  .total-amount {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: #fff;
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 2px;
  }
  #currencyUnit {
    outline: none;
  }
  #currencyUnit:focus {
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.45);
  }

  /* ── FOOTER ── */
  .inv-footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 0;
    padding: 28px 0 0 0;
    position: relative;
    z-index: 2;
    min-height: 200px;
    overflow: visible;
  }

  .footer-building {
    width: 240px;
    height: 160px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    position: relative;
    align-self: flex-end;
    margin-bottom: 20px;
    z-index: 2;
  }
  .footer-building svg { width: 100%; height: 100%; }

  .footer-bank {
    flex: 1;
    padding: 0 24px 20px 24px;
    align-self: flex-end;
    margin-bottom: 40px; /* Thông tin chuyển khoản lên cao */
    position: relative;
    z-index: 2;
  }
  .footer-bank-line {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: rgba(255,255,255,0.9);
    line-height: 1.8;
    outline: none;
    display: block;
  }

  /* Cloud footer decoration */
  .cloud-footer {
    position: absolute;
    bottom: -10px; 
    right: -20px;  
    width: 500px;   
    opacity: 0.3;
    pointer-events: none;
    z-index: 1;
  }

  /* Loading overlay */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #3d87ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    letter-spacing: 0.06em;
  }

  /* Responsive */
  @media (max-width: 820px) {
    #invoice-card { width: 100%; min-width: 0; padding: 28px 20px 0; overflow: hidden; }
    .toolbar { max-width: 100%; }
    .inv-big-title { font-size: 48px; }
    .footer-building { width: 160px; height: 110px; }
    .cloud-header, .cloud-footer { display: none; }
  }
</style>
</head>
<body>

<script>
  // Dữ liệu mặc định cập nhật Qty theo từng mảng tương ứng với Description
  const defaultRows = [
    {
      category: 'CORE',
      descriptions: ['Logo System', 'Color & Type', 'Mini Guideline'],
      qtys: ['', '', ''],
      prices: [9500000, '', '']
    },
    {
      category: 'SOCIAL',
      descriptions: ['Avatar & Cover Pack', 'Template Basic', 'Icon Highlight Covers', 'Aftercare'],
      qtys: ['', '', '', ''],
      prices: [500000, 500000, 500000, 500000]
    },
    {
      category: 'OFFICE',
      descriptions: ['Business Card', 'Consent Form', 'Aftercare', 'A4 Paper Water Mark'],
      qtys: ['', '', '', ''],
      prices: [500000, 250000, '', '']
    }
  ];

  function formatVND(num) {
    if (num === 0) return '0';
    if (!num) return '';
    return num.toLocaleString('vi-VN').replace(/\./g, '.');
  }

  function parsePrice(val) {
    const clean = String(val).replace(/[^\d]/g, '');
    return parseInt(clean) || 0;
  }

  function recalcTotal() {
    const tbody = document.getElementById('invoiceBody');
    const rows = tbody.querySelectorAll('tr.data-row');
    let total = 0;
    
    rows.forEach(row => {
      const prices = row.querySelectorAll('.price-input');
      const qtys = row.querySelectorAll('.qty-input');
      
      prices.forEach((p, index) => {
        const pVal = parsePrice(p.value);
        let qNum = 1; // Mặc định số lượng là 1 nếu bỏ trống
        
        if (qtys[index]) {
          const qStr = qtys[index].value.trim();
          if (qStr !== '' && qStr !== '—') {
             const parsedQ = parseInt(qStr.replace(/[^\d]/g, ''));
             if (!isNaN(parsedQ)) qNum = parsedQ;
          }
        }
        total += pVal * qNum;
      });
    });
    document.getElementById('grandTotal').textContent = formatVND(total);
  }

  function createRow(catVal, descriptions, qtysArray, prices) {
    const tbody = document.getElementById('invoiceBody');
    const tr = document.createElement('tr');
    tr.className = 'data-row';

    // 1. Category
    const catTd = document.createElement('td');
    catTd.className = 'col-category';
    const catInput = document.createElement('input');
    catInput.type = 'text';
    catInput.className = 'cell-input';
    catInput.value = catVal || '';
    catInput.placeholder = 'CATEGORY';
    catTd.appendChild(catInput);

    // 2. Cột chứa danh sách Description
    const descTd = document.createElement('td');
    descTd.className = 'col-desc';
    const descWrapper = document.createElement('div');
    descWrapper.style.display = 'flex';
    descWrapper.style.flexDirection = 'column';
    descWrapper.style.gap = '0'; 
    descTd.appendChild(descWrapper);

    // 3. Cột chứa danh sách Qty (độc lập từng dòng)
    const qtyTd = document.createElement('td');
    qtyTd.className = 'col-qty';
    const qtyWrapper = document.createElement('div');
    qtyWrapper.style.display = 'flex';
    qtyWrapper.style.flexDirection = 'column';
    qtyWrapper.style.gap = '0';
    qtyTd.appendChild(qtyWrapper);

    // 4. Cột chứa danh sách Price 
    const priceTd = document.createElement('td');
    priceTd.className = 'col-price';
    priceTd.style.padding = '14px 24px 14px 20px';
    const priceWrapper = document.createElement('div');
    priceWrapper.style.display = 'flex';
    priceWrapper.style.flexDirection = 'column';
    priceWrapper.style.gap = '0';
    priceWrapper.style.alignItems = 'flex-end';
    priceTd.appendChild(priceWrapper);

    // HÀM QUAN TRỌNG: Tạo 1 bộ 3 ô (Description, Qty, Price)
    function addItemPair(dText, qVal, pVal) {
      // Ô text Description
      const dInput = document.createElement('textarea');
      dInput.className = 'cell-input desc-item';
      dInput.rows = 1;
      dInput.value = dText || '';
      dInput.placeholder = 'Item description...';
      
      // Ô text Qty
      const qInput = document.createElement('textarea');
      qInput.className = 'cell-input qty-input';
      qInput.rows = 1;
      qInput.style.textAlign = 'center';
      qInput.style.width = '100%';
      qInput.style.height = '26px';
      qInput.style.lineHeight = '26px';
      qInput.value = qVal || '';
      qInput.placeholder = '—';

      // Ô text Price
      const pInput = document.createElement('textarea');
      pInput.className = 'cell-input price-input';
      pInput.rows = 1;
      pInput.style.textAlign = 'right';
      pInput.style.width = '110px';
      pInput.style.height = '26px';
      pInput.style.lineHeight = '26px';
      pInput.value = (pVal === 0 || pVal === '') ? '' : formatVND(pVal);

      // Hàm đồng bộ chiều cao cho cả 3 ô
      const syncHeight = () => {
        dInput.style.height = '26px';
        qInput.style.height = '26px';
        pInput.style.height = '26px';
        const newH = Math.max(dInput.scrollHeight, 26);
        dInput.style.height = newH + 'px';
        qInput.style.height = newH + 'px';
        pInput.style.height = newH + 'px';
      };

      dInput.addEventListener('input', syncHeight);

      // Lọc ký tự Qty chỉ nhận số
      qInput.addEventListener('input', () => {
        const raw = qInput.value.replace(/[^\d]/g, '');
        qInput.value = raw;
        recalcTotal();
      });

      // Lọc và format Price
      pInput.addEventListener('input', () => {
        const raw = pInput.value.replace(/[^\d]/g, '');
        pInput.value = raw === '' ? '' : formatVND(parseInt(raw));
        recalcTotal();
      });

      // Xử lý phím tắt thêm/xóa dòng
      const handleKeyDown = (e, currentInput, type) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addItemPair('', '', ''); // Sinh hàng mới (Desc, Qty, Price)
          const allD = descWrapper.querySelectorAll('.desc-item');
          allD[allD.length - 1].focus(); // Tự động focus vào Description
        } else if (e.key === 'Backspace' && currentInput.value === '') {
          // Xóa hàng nếu đang trống
          if (descWrapper.children.length > 1) {
            e.preventDefault();
            const prevD = dInput.previousElementSibling;
            const prevQ = qInput.previousElementSibling;
            const prevP = pInput.previousElementSibling;
            
            dInput.remove();
            qInput.remove();
            pInput.remove();
            
            if (type === 'price' && prevP) prevP.focus();
            else if (type === 'qty' && prevQ) prevQ.focus();
            else if (prevD) prevD.focus();
            recalcTotal();
          }
        }
      };

      dInput.addEventListener('keydown', (e) => handleKeyDown(e, dInput, 'desc'));
      qInput.addEventListener('keydown', (e) => handleKeyDown(e, qInput, 'qty'));
      pInput.addEventListener('keydown', (e) => handleKeyDown(e, pInput, 'price'));

      // Hỗ trợ Copy/Paste nhiều dòng text
      dInput.addEventListener('paste', (e) => {
        const paste = (e.clipboardData || window.clipboardData).getData('text');
        if (paste.includes('\n')) {
          e.preventDefault();
          const lines = paste.split('\n').map(l => l.trim()).filter(l => l);
          dInput.value = lines[0];
          syncHeight();
          for (let i = 1; i < lines.length; i++) {
            addItemPair(lines[i], '', '');
          }
        }
      });

      descWrapper.appendChild(dInput);
      qtyWrapper.appendChild(qInput);
      priceWrapper.appendChild(pInput);
      
      setTimeout(syncHeight, 0);
    }

    // Nạp dữ liệu vào các bộ 3 (Desc, Qty, Price)
    const itemsCount = Math.max(descriptions ? descriptions.length : 1, 1);
    const priceList = prices && prices.length ? prices : [];
    const qtyList = qtysArray && qtysArray.length ? qtysArray : [];
    
    for (let i = 0; i < itemsCount; i++) {
      addItemPair(
        descriptions[i] || '', 
        qtyList[i] !== undefined ? qtyList[i] : '',
        priceList[i] !== undefined ? priceList[i] : ''
      );
    }

    // 5. Delete btn (Xóa cả Category Row)
    const delTd = document.createElement('td');
    delTd.className = 'export-hide';
    delTd.style.verticalAlign = 'top';
    delTd.style.paddingTop = '16px';
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-row-btn export-hide';
    delBtn.textContent = '✕';
    delBtn.title = 'Delete row';
    delBtn.onclick = () => { tr.remove(); recalcTotal(); };
    delTd.appendChild(delBtn);

    // Gắn tất cả vào Row chính
    tr.appendChild(catTd);
    tr.appendChild(descTd);
    tr.appendChild(qtyTd);
    tr.appendChild(priceTd);
    tr.appendChild(delTd);

    tbody.appendChild(tr);
    recalcTotal();
  }

  function addRow() {
    createRow('', [''], [''], ['']);
  }

  // Khởi tạo các dòng mặc định
  defaultRows.forEach(r => {
    createRow(r.category, r.descriptions, r.qtys, r.prices);
  });

  // ── Export PNG ──
  async function exportPNG() {
    const card = document.getElementById('invoice-card');
    const overlay = document.getElementById('loadingOverlay');

    const hideEls = document.querySelectorAll('.export-hide');
    hideEls.forEach(el => el.style.visibility = 'hidden');

    const originalShadow = card.style.boxShadow;
    card.style.boxShadow = 'none';

    overlay.classList.add('show');

    try {
      const canvas = await html2canvas(card, {
        scale: 2.5,
        useCORS: true,
        allowTaint: false,
        backgroundColor: '#0f4fd4',
        logging: false,
        windowWidth: card.scrollWidth,
        windowHeight: card.scrollHeight,
        onclone: function(clonedDoc) {
          const inputs = clonedDoc.querySelectorAll('input, textarea');
          inputs.forEach(el => {
            const div = clonedDoc.createElement('div');
            const computedStyle = clonedDoc.defaultView.getComputedStyle(el);
            
            div.style.cssText = computedStyle.cssText;
            div.style.whiteSpace = 'pre-wrap';
            div.style.wordBreak = 'break-word';
            div.style.margin = '0';
            
            if (el.classList.contains('inv-big-title')) { 
              div.style.marginBottom = '20px'; 
              div.style.display = 'block'; 
            }
            if (el.classList.contains('inv-service-label')) { 
              div.style.marginBottom = '14px'; 
              div.style.display = 'block'; 
            }
            if (el.classList.contains('inv-subtitle')) {
              div.style.display = 'block'; 
            }

            if (el.tagName === 'TEXTAREA') {
              div.style.lineHeight = '26px';
            }

            if(el.style.textAlign) { div.style.textAlign = el.style.textAlign; }
            if(el.classList.contains('price-input') || el.classList.contains('qty-input')) { 
                if (el.classList.contains('price-input')) div.style.textAlign = 'right'; 
                if (el.classList.contains('qty-input')) div.style.textAlign = 'center'; 
                div.style.whiteSpace = 'nowrap';
            }
            
            div.innerText = el.value || el.placeholder || '';
            el.parentNode.replaceChild(div, el);
          });
        }
      });

      const link = document.createElement('a');
      link.download = 'KENG-Invoice-' + (document.getElementById('invNo').textContent.trim() || 'export') + '.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    } catch(e) {
      alert('Export failed: ' + e.message);
    } finally {
      hideEls.forEach(el => el.style.visibility = '');
      card.style.boxShadow = originalShadow;
      overlay.classList.remove('show');
    }
  }
</script>
