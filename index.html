<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Generator — KENG Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --blue-main: #1a6bff;
    --blue-dark: #0f4fd4;
    --blue-light: #3d87ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a1628;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    width: 100%;
    max-width: 780px;
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: #fff;
    letter-spacing: 0.04em;
    flex: 1;
  }
  .toolbar h1 span { color: #3d87ff; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
    border: none;
    transition: all 0.18s ease;
  }
  .btn-add {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.2);
  }
  .btn-add:hover { background: rgba(255,255,255,0.18); }
  .btn-export {
    background: linear-gradient(135deg, #1a6bff 0%, #00c6ff 100%);
    color: #fff;
    box-shadow: 0 4px 20px rgba(26,107,255,0.5);
  }
  .btn-export:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(26,107,255,0.65); }
  .btn-export:active { transform: translateY(0); }

  /* ── INVOICE CARD ── */
  #invoice-card {
    width: 780px;
    min-height: 1080px;
    background-color: #0f4fd4; /* Solid fallback */
    background-image: linear-gradient(145deg, #1a6bff 0%, #0f4fd4 50%, #0a3ab8 100%);
    border-radius: 24px;
    padding: 44px 48px 0 48px;
    position: relative;
    overflow: visible; /* Để mây header có thể tràn ra */
    box-shadow: 0 24px 80px rgba(10,25,70,0.6);
  }

  /* Decorative blobs */
  #invoice-card::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    pointer-events: none;
    z-index: 1;
  }
  #invoice-card::after {
    content: '';
    position: absolute;
    bottom: 160px; left: -100px;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    pointer-events: none;
    z-index: 1;
  }

  /* ── HEADER ROW ── */
  .inv-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 36px;
    position: relative;
    z-index: 2;
  }

  .logo-block {
    display: flex; align-items: center;
  }
  .logo-block img {
    height: 56px;
    width: auto;
    object-fit: contain;
  }

  .inv-meta { text-align: right; }
  .inv-meta-row {
    display: flex; gap: 32px; justify-content: flex-end;
    margin-bottom: 4px;
  }
  .inv-meta-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
  }
  .inv-meta-value {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    outline: none;
    display: inline-block;
  }
  [contenteditable]:focus {
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    outline: 2px solid rgba(255,255,255,0.5);
    padding: 1px 4px;
  }

  /* ── TITLE SECTION ── */
  .inv-title-section {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
    z-index: 2;
    overflow: visible;
  }

  /* Cloud header decoration */
  .cloud-header {
    position: absolute;
    top: -40px;
    left: 0;
    width: 100%;
    opacity: 0.2;
    pointer-events: none;
    z-index: 1;
  }

  .inv-big-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 72px;
    letter-spacing: 0.12em;
    color: #fff;
    line-height: 1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.18);
    outline: none;
    display: block;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
  }
  .inv-service-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.1em;
    outline: none;
    display: block;
    margin-bottom: 14px;
    position: relative;
    z-index: 2;
  }
  .inv-subtitle {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 17px;
    color: #fff;
    letter-spacing: 0.12em;
    outline: none;
    display: block;
    position: relative;
    z-index: 2;
  }

  /* ── TABLE CONTAINER ── */
  .inv-table-container {
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    overflow: hidden;
    margin-bottom: 0;
    position: relative;
    z-index: 2;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    border-bottom: 1px solid rgba(255,255,255,0.22);
  }
  thead th {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.9);
    padding: 16px 20px;
    text-align: left;
  }
  thead th:last-child { text-align: right; padding-right: 24px; }
  thead th.col-qty { text-align: center; width: 80px; }

  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.13);
    transition: background 0.15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.05); }

  td {
    padding: 14px 20px;
    vertical-align: top;
  }
  td.col-category {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #fff;
    white-space: nowrap;
    width: 120px;
  }
  td.col-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
  }
  td.col-qty {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    text-align: center;
    width: 80px;
  }
  td.col-price {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: #fff;
    text-align: right;
    padding-right: 24px;
    white-space: nowrap;
  }

  /* Editable cell inputs */
  .cell-input {
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    color: inherit;
    letter-spacing: inherit;
    width: 100%;
    padding: 0;
  }
  .cell-input:focus {
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    padding: 2px 5px;
    margin: -2px -5px;
    outline: 2px solid rgba(255,255,255,0.45);
  }
  .cell-input::placeholder { color: rgba(255,255,255,0.35); }

  /* Đã tối ưu hóa chiều cao để Description và Price thẳng hàng 100% */
  textarea.cell-input {
    resize: none;
    min-height: 26px;
    line-height: 26px; /* Ép cứng chiều cao mỗi dòng */
    overflow: hidden;
  }

  /* Delete row btn */
  .delete-row-btn {
    background: rgba(255,80,80,0.2);
    border: 1px solid rgba(255,100,100,0.3);
    color: rgba(255,150,150,0.9);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .delete-row-btn:hover {
    background: rgba(255,80,80,0.4);
    color: #fff;
  }

  /* Total row */
  .total-row td {
    padding: 18px 24px 18px 20px;
    border-top: 1.5px solid rgba(255,255,255,0.3);
  }
  .total-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    text-align: right;
    display: block;
    letter-spacing: 0.04em;
  }
  .total-amount {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: #fff;
    display: block;
    margin-top: 2px;
  }

  /* ── FOOTER ── */
  .inv-footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 0;
    padding: 28px 0 0 0;
    position: relative;
    z-index: 2;
    min-height: 200px;
    overflow: visible;
  }

  .footer-building {
    width: 240px;
    height: 160px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    position: relative;
    align-self: flex-end;
    margin-bottom: 20px;
    z-index: 2;
  }
  .footer-building svg { width: 100%; height: 100%; }

  .footer-bank {
    flex: 1;
    padding: 0 24px 20px 24px;
    align-self: flex-end;
    position: relative;
    z-index: 2;
  }
  .footer-bank-line {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: rgba(255,255,255,0.9);
    line-height: 1.8;
    outline: none;
    display: block;
  }

  /* Cloud footer decoration */
  .cloud-footer {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 450px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 1;
  }

  /* Loading overlay */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #3d87ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    letter-spacing: 0.06em;
  }

  /* Responsive */
  @media (max-width: 820px) {
    #invoice-card { width: 100%; min-width: 0; padding: 28px 20px 0; overflow: hidden; }
    .toolbar { max-width: 100%; }
    .inv-big-title { font-size: 48px; }
    .footer-building { width: 160px; height: 110px; }
    .cloud-header, .cloud-footer { display: none; }
  }
</style>
</head>
<body>

</div>

<div class="toolbar" id="toolbar">

<script>
  const defaultRows = [
    {
      category: 'CORE',
      descriptions: ['Logo System', 'Color & Type', 'Mini Guideline'],
      qty: '',
      prices: [9500000, 0, 0]
    },
    {
      category: 'SOCIAL',
      descriptions: ['Avatar & Cover Pack', 'Template Basic', 'Icon Highlight Covers', 'Aftercare'],
      qty: '',
      prices: [500000, 500000, 500000, 500000]
    },
    {
      category: 'OFFICE',
      descriptions: ['Business Card', 'Consent Form', 'Aftercare', 'A4 Paper Water Mark'],
      qty: '',
      prices: [500000, 250000, 0, 0]
    }
  ];

  function formatVND(num) {
    if (!num && num !== 0) return '0';
    return num.toLocaleString('vi-VN').replace(/\./g, '.');
  }

  function parsePrice(val) {
    const clean = String(val).replace(/[^\d]/g, '');
    return parseInt(clean) || 0;
  }

  function recalcTotal() {
    const tbody = document.getElementById('invoiceBody');
    const rows = tbody.querySelectorAll('tr.data-row');
    let total = 0;
    rows.forEach(row => {
      const prices = row.querySelectorAll('.price-input');
      const qty = parsePrice(row.querySelector('.qty-input')?.value || '1') || 1;
      prices.forEach(p => {
        const val = parsePrice(p.value);
        total += val * (qty > 1 ? qty : 1);
      });
    });
    document.getElementById('grandTotal').textContent = formatVND(total) + ' VNĐ';
  }

  function createRow(catVal, descriptions, qtyVal, prices) {
    const tbody = document.getElementById('invoiceBody');
    const tr = document.createElement('tr');
    tr.className = 'data-row';

    // 1. Category
    const catTd = document.createElement('td');
    catTd.className = 'col-category';
    const catInput = document.createElement('input');
    catInput.type = 'text';
    catInput.className = 'cell-input';
    catInput.value = catVal || '';
    catInput.placeholder = 'CATEGORY';
    catTd.appendChild(catInput);

    // Chuẩn bị khối chứa Price để mô-đun Description có thể gọi tới
    const priceTd = document.createElement('td');
    priceTd.className = 'col-price';
    priceTd.style.padding = '14px 24px 14px 20px';

    const priceWrapper = document.createElement('div');
    priceWrapper.style.display = 'flex';
    priceWrapper.style.flexDirection = 'column';
    priceWrapper.style.gap = '0'; // Đã xóa khoảng cách để song song với text
    priceWrapper.style.alignItems = 'flex-end';
    priceTd.appendChild(priceWrapper);

    // Hàm tạo 1 ô nhập giá nhỏ (sẽ được gọi nhiều lần)
    function addPriceInput(val, isFirst) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'cell-input price-input';
      inp.style.textAlign = 'right';
      inp.style.width = '110px';
      inp.style.height = '26px'; // Khớp hoàn toàn với line-height của text
      inp.style.lineHeight = '26px';
      inp.value = val > 0 ? formatVND(val) : (isFirst ? '' : '0');
      inp.placeholder = '0';
      inp.addEventListener('input', () => {
        const raw = inp.value.replace(/[^\d]/g, '');
        const num = parseInt(raw) || 0;
        if (raw) inp.value = formatVND(num);
        recalcTotal();
      });
      priceWrapper.appendChild(inp);
    }

    // Nạp data mặc định cho Price
    const priceList = prices && prices.length ? prices : [0];
    priceList.forEach((p, i) => addPriceInput(p, i === 0 && !p));

    // 2. Description
    const descTd = document.createElement('td');
    descTd.className = 'col-desc';
    const descInput = document.createElement('textarea');
    descInput.className = 'cell-input';
    descInput.rows = Math.max(descriptions ? descriptions.length : 1, 1);
    descInput.value = descriptions ? descriptions.join('\n') : '';
    descInput.placeholder = 'Description...';

    // BẮT SỰ KIỆN: Tự động thêm/xóa ô Price khi Enter/Xóa dòng
    descInput.addEventListener('input', () => {
      const lines = descInput.value.split('\n').length;
      descInput.rows = Math.max(lines, 1); // Cập nhật chiều cao textarea

      const currentPrices = priceWrapper.querySelectorAll('.price-input');
      const currentCount = currentPrices.length;

      // Nếu số dòng nhiều hơn số ô Price -> Sinh thêm ô Price mới
      if (lines > currentCount) {
        for (let i = currentCount; i < lines; i++) {
          addPriceInput(0, false);
        }
      } 
      // Nếu số dòng ít hơn số ô Price -> Xóa bớt ô Price cuối cùng
      else if (lines < currentCount) {
        for (let i = currentCount - 1; i >= lines; i--) {
          currentPrices[i].remove();
        }
        recalcTotal();
      }
    });
    descTd.appendChild(descInput);

    // 3. Qty
    const qtyTd = document.createElement('td');
    qtyTd.className = 'col-qty';
    const qtyInput = document.createElement('input');
    qtyInput.type = 'text';
    qtyInput.className = 'cell-input';
    qtyInput.style.textAlign = 'center';
    qtyInput.value = qtyVal || '';
    qtyInput.placeholder = '—';
    qtyInput.addEventListener('input', recalcTotal);
    qtyTd.appendChild(qtyInput);

    // 4. Delete btn
    const delTd = document.createElement('td');
    delTd.className = 'export-hide';
    delTd.style.verticalAlign = 'top';
    delTd.style.paddingTop = '16px';
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-row-btn export-hide';
    delBtn.textContent = '✕';
    delBtn.title = 'Delete row';
    delBtn.onclick = () => { tr.remove(); recalcTotal(); };
    delTd.appendChild(delBtn);

    // Lắp ghép các cột vào dòng theo đúng thứ tự
    tr.appendChild(catTd);
    tr.appendChild(descTd);
    tr.appendChild(qtyTd);
    tr.appendChild(priceTd);
    tr.appendChild(delTd);

    tbody.appendChild(tr);
    recalcTotal();
  }

  function addRow() {
    createRow('', [''], '', [0]);
  }

  // Init default rows
  defaultRows.forEach(r => {
    createRow(r.category, r.descriptions, r.qty, r.prices);
  });

  // ── Export PNG ──
  async function exportPNG() {
    const card = document.getElementById('invoice-card');
    const overlay = document.getElementById('loadingOverlay');

    const hideEls = document.querySelectorAll('.export-hide');
    hideEls.forEach(el => el.style.visibility = 'hidden');

    const originalShadow = card.style.boxShadow;
    card.style.boxShadow = 'none';

    overlay.classList.add('show');

    try {
      const canvas = await html2canvas(card, {
        scale: 2.5,
        useCORS: true,
        allowTaint: false,
        backgroundColor: '#0f4fd4',
        logging: false,
        windowWidth: card.scrollWidth,
        windowHeight: card.scrollHeight,
        onclone: function(clonedDoc) {
          const inputs = clonedDoc.querySelectorAll('input, textarea');
          inputs.forEach(el => {
            const div = clonedDoc.createElement('div');
            const computedStyle = clonedDoc.defaultView.getComputedStyle(el);
            
            div.style.cssText = computedStyle.cssText;
            div.style.whiteSpace = 'pre-wrap';
            div.style.wordBreak = 'break-word';
            div.style.margin = '0';
            
            // Xử lý giữ nguyên khoảng cách cho các tiêu đề
            if (el.classList.contains('inv-big-title')) { 
              div.style.marginBottom = '20px'; 
              div.style.display = 'block'; 
            }
            if (el.classList.contains('inv-service-label')) { 
              div.style.marginBottom = '14px'; 
              div.style.display = 'block'; 
            }
            if (el.classList.contains('inv-subtitle')) {
              div.style.display = 'block'; 
            }

            // Đồng bộ chiều cao dòng lúc xuất file để không bị lệch hàng
            if (el.tagName === 'TEXTAREA') {
              div.style.lineHeight = '26px';
            }

            if(el.style.textAlign) { div.style.textAlign = el.style.textAlign; }
            if(el.classList.contains('price-input')) { div.style.textAlign = 'right'; }
            
            div.innerText = el.value || el.placeholder || '';
            el.parentNode.replaceChild(div, el);
          });
        }
      });

      const link = document.createElement('a');
      link.download = 'KENG-Invoice-' + (document.getElementById('invNo').textContent.trim() || 'export') + '.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    } catch(e) {
      alert('Export failed: ' + e.message);
    } finally {
      hideEls.forEach(el => el.style.visibility = '');
      card.style.boxShadow = originalShadow;
      overlay.classList.remove('show');
    }
  }
</script>
</body>
